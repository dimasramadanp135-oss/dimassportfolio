<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">Hasil card sorting menu BPK PENABUR</title>
  <desc id="desc">Setiap item menu ditampilkan sebagai sticky note terpisah, dikelompokkan dalam empat kategori dropdown: Profil, Akademik, Media, dan Kegiatan. Beranda dan Hubungi Kami menjadi sticky note tersendiri di luar kategori.</desc>
  <defs>
    <filter id="paper-shadow" x="-20%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="1" dy="5" stdDeviation="4" flood-color="#020617" flood-opacity=".24"/>
    </filter>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .eyebrow{font-size:14px;font-weight:700;letter-spacing:2px;fill:#94a3b8}
      .title{font-size:32px;font-weight:800;letter-spacing:-.6px;fill:#f8fafc}
      .subtitle{font-size:16px;fill:#cbd5e1}
      .group-title{font-size:19px;font-weight:800;fill:#e2e8f0}
      .count{font-size:12px;font-weight:700;letter-spacing:1px;fill:#94a3b8}
      .note-text{font-size:17px;font-weight:700;fill:#102a43}
      .direct-label{font-size:13px;font-weight:700;letter-spacing:1px;fill:#94a3b8}
    </style>
  </defs>
  <rect width="1200" height="790" rx="28" fill="#111827"/>
  <text x="56" y="58" class="eyebrow">CARD SORTING · HASIL PENGELOMPOKAN</text>
  <text x="56" y="106" class="title">Satu menu, satu sticky note</text>
  <text x="56" y="137" class="subtitle">Setiap menu dikelompokkan ke dalam kategori dropdown yang paling sesuai.</text>

  <!-- Four category groups -->
  <g>
    <rect x="48" y="174" width="264" height="440" rx="18" fill="#1f2937" stroke="#374151"/>
    <text x="68" y="211" class="group-title">Profil</text>
    <text x="292" y="211" text-anchor="end" class="count">5 ITEM</text>
    <g filter="url(#paper-shadow)" transform="rotate(-1 180 267)"><rect x="73" y="235" width="214" height="54" rx="3" fill="#67e8f9"/><path d="M73 235h214v8H73z" fill="#22d3ee" opacity=".65"/><text x="180" y="269" text-anchor="middle" class="note-text">Sekolah</text></g>
    <g filter="url(#paper-shadow)" transform="rotate(.8 180 332)"><rect x="73" y="300" width="214" height="54" rx="3" fill="#67e8f9"/><path d="M73 300h214v8H73z" fill="#22d3ee" opacity=".65"/><text x="180" y="334" text-anchor="middle" class="note-text">Tentang</text></g>
    <g filter="url(#paper-shadow)" transform="rotate(-.6 180 397)"><rect x="73" y="365" width="214" height="54" rx="3" fill="#67e8f9"/><path d="M73 365h214v8H73z" fill="#22d3ee" opacity=".65"/><text x="180" y="399" text-anchor="middle" class="note-text">Renungan</text></g>
    <g filter="url(#paper-shadow)" transform="rotate(.7 180 462)"><rect x="73" y="430" width="214" height="54" rx="3" fill="#67e8f9"/><path d="M73 430h214v8H73z" fill="#22d3ee" opacity=".65"/><text x="180" y="464" text-anchor="middle" class="note-text">Program</text></g>
    <g filter="url(#paper-shadow)" transform="rotate(-.8 180 527)"><rect x="73" y="495" width="214" height="54" rx="3" fill="#67e8f9"/><path d="M73 495h214v8H73z" fill="#22d3ee" opacity=".65"/><text x="180" y="529" text-anchor="middle" class="note-text">Fasilitas</text></g>
  </g>

  <g>
    <rect x="336" y="174" width="264" height="440" rx="18" fill="#1f2937" stroke="#374151"/>
    <text x="356" y="211" class="group-title">Akademik</text>
    <text x="580" y="211" text-anchor="end" class="count">2 ITEM</text>
    <g filter="url(#paper-shadow)" transform="rotate(.8 468 267)"><rect x="361" y="235" width="214" height="54" rx="3" fill="#bfdbfe"/><path d="M361 235h214v8H361z" fill="#60a5fa" opacity=".7"/><text x="468" y="269" text-anchor="middle" class="note-text">SPMB</text></g>
    <g filter="url(#paper-shadow)" transform="rotate(-.7 468 332)"><rect x="361" y="300" width="214" height="54" rx="3" fill="#bfdbfe"/><path d="M361 300h214v8H361z" fill="#60a5fa" opacity=".7"/><text x="468" y="334" text-anchor="middle" class="note-text">Karir</text></g>
  </g>

  <g>
    <rect x="624" y="174" width="264" height="440" rx="18" fill="#1f2937" stroke="#374151"/>
    <text x="644" y="211" class="group-title">Media</text>
    <text x="868" y="211" text-anchor="end" class="count">3 ITEM</text>
    <g filter="url(#paper-shadow)" transform="rotate(-.7 756 267)"><rect x="649" y="235" width="214" height="54" rx="3" fill="#fecdd3"/><path d="M649 235h214v8H649z" fill="#fb7185" opacity=".7"/><text x="756" y="269" text-anchor="middle" class="note-text">Berita</text></g>
    <g filter="url(#paper-shadow)" transform="rotate(.7 756 332)"><rect x="649" y="300" width="214" height="54" rx="3" fill="#fecdd3"/><path d="M649 300h214v8H649z" fill="#fb7185" opacity=".7"/><text x="756" y="334" text-anchor="middle" class="note-text">Artikel</text></g>
    <g filter="url(#paper-shadow)" transform="rotate(-.5 756 397)"><rect x="649" y="365" width="214" height="54" rx="3" fill="#fecdd3"/><path d="M649 365h214v8H649z" fill="#fb7185" opacity=".7"/><text x="756" y="399" text-anchor="middle" class="note-text">Publikasi</text></g>
  </g>

  <g>
    <rect x="912" y="174" width="240" height="440" rx="18" fill="#1f2937" stroke="#374151"/>
    <text x="932" y="211" class="group-title">Kegiatan</text>
    <text x="1132" y="211" text-anchor="end" class="count">5 ITEM</text>
    <g filter="url(#paper-shadow)" transform="rotate(.6 1032 267)"><rect x="937" y="235" width="190" height="54" rx="3" fill="#bbf7d0"/><path d="M937 235h190v8H937z" fill="#4ade80" opacity=".7"/><text x="1032" y="269" text-anchor="middle" class="note-text">Kegiatan</text></g>
    <g filter="url(#paper-shadow)" transform="rotate(-.7 1032 332)"><rect x="937" y="300" width="190" height="54" rx="3" fill="#bbf7d0"/><path d="M937 300h190v8H937z" fill="#4ade80" opacity=".7"/><text x="1032" y="334" text-anchor="middle" class="note-text">Galeri</text></g>
    <g filter="url(#paper-shadow)" transform="rotate(.6 1032 397)"><rect x="937" y="365" width="190" height="54" rx="3" fill="#bbf7d0"/><path d="M937 365h190v8H937z" fill="#4ade80" opacity=".7"/><text x="1032" y="399" text-anchor="middle" class="note-text">Karya</text></g>
    <g filter="url(#paper-shadow)" transform="rotate(-.5 1032 462)"><rect x="937" y="430" width="190" height="54" rx="3" fill="#bbf7d0"/><path d="M937 430h190v8H937z" fill="#4ade80" opacity=".7"/><text x="1032" y="464" text-anchor="middle" class="note-text">Prestasi</text></g>
    <g filter="url(#paper-shadow)" transform="rotate(.7 1032 527)"><rect x="937" y="495" width="190" height="54" rx="3" fill="#bbf7d0"/><path d="M937 495h190v8H937z" fill="#4ade80" opacity=".7"/><text x="1032" y="529" text-anchor="middle" class="note-text">Testimoni</text></g>
  </g>

  <text x="56" y="661" class="direct-label">MENU LANGSUNG DI NAVBAR · DI LUAR EMPAT KATEGORI</text>
  <g filter="url(#paper-shadow)" transform="rotate(-.6 160 718)"><rect x="60" y="685" width="200" height="58" rx="3" fill="#ddd6fe"/><path d="M60 685h200v8H60z" fill="#a78bfa" opacity=".7"/><text x="160" y="722" text-anchor="middle" class="note-text">Beranda</text></g>
  <g filter="url(#paper-shadow)" transform="rotate(.5 405 718)"><rect x="305" y="685" width="200" height="58" rx="3" fill="#ddd6fe"/><path d="M305 685h200v8H305z" fill="#a78bfa" opacity=".7"/><text x="405" y="722" text-anchor="middle" class="note-text">Hubungi Kami</text></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Task flow website PENABUR</title>
  <desc id="desc">Pengunjung memulai dari Beranda, memilih tujuan, lalu mengikuti salah satu dari enam jalur tugas: pendaftaran, mengenal PENABUR, program dan fasilitas, informasi dan media, aktivitas dan karya, atau karir. Hubungi Kami tersedia dari halaman mana pun.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#020617" flood-opacity=".2"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#64748b"/>
    </marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .eyebrow{font-size:14px;font-weight:700;letter-spacing:2px;fill:#94a3b8}
      .title{font-size:32px;font-weight:800;fill:#f8fafc;letter-spacing:-.6px}
      .subtitle{font-size:16px;fill:#cbd5e1}
      .node-title{font-size:19px;font-weight:800;fill:#f8fafc}
      .node-sub{font-size:14px;fill:#cbd5e1}
      .card-title{font-size:17px;font-weight:800;fill:#f8fafc}
      .path{font-size:15px;font-weight:600;fill:#dbeafe}
      .result{font-size:14px;fill:#a7f3d0}
      .label{font-size:13px;font-weight:700;letter-spacing:1px;fill:#94a3b8}
    </style>
  </defs>
  <rect width="1200" height="850" rx="28" fill="#111827"/>
  <text x="56" y="58" class="eyebrow">USER FLOW · TASK FLOW</text>
  <text x="56" y="104" class="title">Dari beranda menuju tujuan pengunjung</text>
  <text x="56" y="136" class="subtitle">Pilih salah satu jalur; Beranda dan Hubungi Kami dapat dijangkau dari seluruh halaman.</text>

  <!-- Entry flow -->
  <g filter="url(#shadow)">
    <rect x="56" y="170" width="220" height="92" rx="16" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="166" y="208" text-anchor="middle" class="node-title">Mulai</text>
    <text x="166" y="235" text-anchor="middle" class="node-sub">Pengunjung membuka website</text>
    <rect x="386" y="170" width="250" height="92" rx="16" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="511" y="208" text-anchor="middle" class="node-title">Beranda</text>
    <text x="511" y="235" text-anchor="middle" class="node-sub">Lihat ringkasan dan navbar</text>
    <rect x="746" y="170" width="398" height="92" rx="16" fill="#312e81" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="945" y="208" text-anchor="middle" class="node-title">Pilih tujuan kunjungan</text>
    <text x="945" y="235" text-anchor="middle" class="node-sub">Pilih menu atau kategori yang sesuai</text>
  </g>
  <path d="M276 216h96" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M636 216h96" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M945 262v40H600" fill="none" stroke="#64748b" stroke-width="2.5"/>
  <path d="M600 302v28" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="56" y="326" class="label">PILIH SATU JALUR</text>

  <!-- Six task paths -->
  <g filter="url(#shadow)">
    <rect x="56" y="350" width="346" height="126" rx="14" fill="#1f2937" stroke="#334155"/>
    <rect x="56" y="350" width="7" height="126" rx="3" fill="#fbbf24"/>
    <text x="80" y="382" class="card-title">01 · Pendaftaran</text>
    <text x="80" y="412" class="path">SPMB → Sekolah</text>
    <text x="80" y="447" class="result">Hasil: informasi pendaftaran ditemukan</text>

    <rect x="427" y="350" width="346" height="126" rx="14" fill="#1f2937" stroke="#334155"/>
    <rect x="427" y="350" width="7" height="126" rx="3" fill="#60a5fa"/>
    <text x="451" y="382" class="card-title">02 · Kenali PENABUR</text>
    <text x="451" y="412" class="path">Profil / Kegiatan → Tentang / Testimoni</text>
    <text x="451" y="447" class="result">Hasil: profil dan pengalaman dipahami</text>

    <rect x="798" y="350" width="346" height="126" rx="14" fill="#1f2937" stroke="#334155"/>
    <rect x="798" y="350" width="7" height="126" rx="3" fill="#34d399"/>
    <text x="822" y="382" class="card-title">03 · Program &amp; fasilitas</text>
    <text x="822" y="412" class="path">Profil → Program / Fasilitas</text>
    <text x="822" y="447" class="result">Hasil: informasi program diperoleh</text>

    <rect x="56" y="498" width="346" height="126" rx="14" fill="#1f2937" stroke="#334155"/>
    <rect x="56" y="498" width="7" height="126" rx="3" fill="#fb7185"/>
    <text x="80" y="530" class="card-title">04 · Informasi &amp; media</text>
    <text x="80" y="560" class="path">Media / Profil → Berita / Artikel / Renungan</text>
    <text x="80" y="595" class="result">Hasil: konten pilihan dibaca atau ditonton</text>

    <rect x="427" y="498" width="346" height="126" rx="14" fill="#1f2937" stroke="#334155"/>
    <rect x="427" y="498" width="7" height="126" rx="3" fill="#a78bfa"/>
    <text x="451" y="530" class="card-title">05 · Aktivitas &amp; karya</text>
    <text x="451" y="560" class="path">Kegiatan → Kegiatan / Galeri / lainnya</text>
    <text x="451" y="595" class="result">Hasil: informasi dan karya berhasil dilihat</text>

    <rect x="798" y="498" width="346" height="126" rx="14" fill="#1f2937" stroke="#334155"/>
    <rect x="798" y="498" width="7" height="126" rx="3" fill="#38bdf8"/>
    <text x="822" y="530" class="card-title">06 · Karir</text>
    <text x="822" y="560" class="path">Akademik → Karir</text>
    <text x="822" y="595" class="result">Hasil: informasi karir dapat ditinjau</text>
  </g>

  <path d="M600 624v34" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="56" y="676" width="1088" height="112" rx="18" fill="#172554" stroke="#3b82f6" stroke-opacity=".55"/>
  <text x="82" y="712" class="label">AKSES DI SELURUH HALAMAN</text>
  <text x="82" y="750" class="card-title">Hubungi Kami</text>
  <text x="250" y="750" class="subtitle">Buka kontak untuk melihat alamat, telepon, atau email yang tersedia.</text>
  <text x="82" y="775" font-size="13" fill="#94a3b8">Beranda juga dapat dipilih kembali untuk memulai jalur lain.</text>
</svg>
